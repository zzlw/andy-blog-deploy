# Pier 生产栈：无 gateway / 无 acme。入口由 Pier Traefik 反代。
# 用法（服务器）：
#   docker compose -f docker-compose.pier.yml --env-file .env.production --env-file .env.production.local up -d
# CDN 续期用 docker-compose.acme.yml，不要和本文件一起 up。
name: andy-blog

services:
  mongo:
    image: mongo:7
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand('ping').ok\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - blog

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - blog

  api:
    image: ${REGISTRY:-andy-blog}/andy-blog-api:${API_TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/andy_blog
      REDIS_URI: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INIT_NAME: ${ADMIN_INIT_NAME:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SITE_NAME: ${SITE_NAME:-}
      SITE_URL: ${SITE_URL:-}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
      SITE_KEYWORDS: ${SITE_KEYWORDS:-}
      WEBHOOK_ENDPOINT: ${WEBHOOK_ENDPOINT:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ANALYTICS_CACHE_TTL: ${ANALYTICS_CACHE_TTL:-300}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 仅本机，给 Pier 写 port_allocations；公网入口走 Traefik / pier-net
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - blog
      - pier-net

  web:
    image: ${REGISTRY:-andy-blog}/andy-blog-web:${WEB_TAG:-latest}
    restart: always
    environment:
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL}
      NUXT_API_BASE_INTERNAL: http://api:3000
      NUXT_PUBLIC_STATIC_PATH: ${STATIC_PATH}
      NUXT_PUBLIC_AI_API_BASE: ${AI_API_BASE:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:13001:3000"
    networks:
      - blog
      - pier-net

  # Nuxt 不会托管构建后挂进去的根路径文件；微信/站点校验走这个小 nginx
  verify:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./nginx/static:/usr/share/nginx/html:ro
    networks:
      - pier-net

  admin:
    image: ${REGISTRY:-andy-blog}/andy-blog-admin:${ADMIN_TAG:-latest}
    restart: always
    environment:
      API_BASE_URL: ${API_BASE_URL}
      STATIC_PATH: ${STATIC_PATH}
      AI_API_BASE: ${AI_API_BASE:-}
      NGINX_PORT: 80
    depends_on:
      - api
    ports:
      - "127.0.0.1:13080:80"
    networks:
      - blog
      - pier-net

networks:
  blog:
    driver: bridge
  pier-net:
    external: true
    name: pier-net

volumes:
  mongo-data:
    external: true
    name: andy-blog_mongo-data
  redis-data:
    external: true
    name: andy-blog_redis-data
