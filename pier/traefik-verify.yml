# 站点根路径校验文件（Nuxt 不托管运行时挂载的文件）
# 线上：/opt/pier/data/traefik/dynamic/andy-blog-verify.yml
http:
  routers:
    blog-verify-txt:
      rule: Host(`jiawen.live`) && Path(`/70260db84715fa726d734055a5d83d0c.txt`)
      priority: 100
      entryPoints: [websecure]
      service: blog-verify
      tls:
        certResolver: letsencrypt
  services:
    blog-verify:
      loadBalancer:
        servers:
          - url: http://andy-blog-verify-1:80
