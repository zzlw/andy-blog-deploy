# 站点根路径校验文件。Nuxt 不托管运行时挂进去的 public 文件，
# 所以这条路由打到已有的 admin nginx（不要再单独起 verify 容器）。
# 线上：/opt/pier/data/traefik/dynamic/andy-blog-verify.yml
http:
  routers:
    blog-verify-txt:
      rule: Host(`jiawen.live`) && Path(`/70260db84715fa726d734055a5d83d0c.txt`)
      priority: 100
      entryPoints: [websecure]
      service: blog-verify-file
      tls:
        certResolver: letsencrypt
  services:
    blog-verify-file:
      loadBalancer:
        servers:
          - url: http://andy-blog-admin-1:80
